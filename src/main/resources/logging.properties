# Configuracion de logging para ControlPacientes
# Los logs se guardaran en %APPDATA%\ControlPacientes\logs\

handlers=java.util.logging.FileHandler, java.util.logging.ConsoleHandler

# Nivel de log global (SEVERE, WARNING, INFO, CONFIG, FINE, FINER, FINEST)
.level=INFO

# Configuracion del FileHandler
java.util.logging.FileHandler.level=ALL
java.util.logging.FileHandler.pattern=%t/ControlPacientes/logs/app-%u-%g.log
java.util.logging.FileHandler.limit=10485760
java.util.logging.FileHandler.count=5
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter

# Configuracion del ConsoleHandler
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# Formato del log
java.util.logging.SimpleFormatter.format=%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS %4$s %2$s: %5$s%n

# Loggers para componentes especificos
com.controlpacientes.level=FINE
com.controlpacientes.service.level=FINE
com.controlpacientes.repository.level=FINE
com.controlpacientes.ui.level=FINE

# Reducir verbosidad de librerías externas
org.springframework.level=WARNING
javafx.level=WARNING
