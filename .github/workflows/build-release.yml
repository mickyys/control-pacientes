name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build Release
        run: dotnet build -c Release
      
      - name: Publish Application
        run: dotnet publish ControlPacientes.UI/ControlPacientes.UI.csproj -c Release -r win-x64 --self-contained -o publish
      
      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix
      
      - name: Build Installer
        run: |
          wix build -o installer.msi ControlPacientes.Installer/Product.wxs
      
      - name: Get Version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path "ControlPacientes.UI/ControlPacientes.UI.csproj" -Pattern '<Version>(.*?)</Version>' | ForEach-Object { $_.Matches.Groups[1].Value })
          if (-not $version) { $version = "1.0.0" }
          echo "app_version=$version" >> $env:GITHUB_OUTPUT
      
      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.app_version }}
          name: Release v${{ steps.version.outputs.app_version }}
          draft: false
          prerelease: false
          files: ./installer.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
