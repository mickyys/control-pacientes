name: Build Windows Installer

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: '19'
          distribution: 'temurin'
          cache: maven
      
      - name: Build application with Maven
        run: mvn clean package -DskipTests
      
      - name: Install WiX Toolset
        run: |
          choco install -y wixtoolset
        shell: powershell
        continue-on-error: true
      
      - name: Create MSI Installer with jpackage
        run: |
          Write-Host "Starting jpackage MSI creation..."
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Target directory contents:"
          Get-ChildItem target | ForEach-Object { Write-Host "  - $($_.Name)" }
          
          $iconPath = Resolve-Path "src\main\resources\images\icono.ico"
          Write-Host "Icon path: $iconPath"
          
          # Crear directorio de salida para jpackage
          New-Item -ItemType Directory -Path "target\output" -Force | Out-Null
          
          Write-Host "Running jpackage with verbose output..."
          jpackage --verbose `
            --input target `
            --name "ControlPacientes" `
            --main-jar control-pacientes-java-1.0.0.jar `
            --main-class com.controlpacientes.ControlPacientesApplication `
            --type msi `
            --icon $iconPath `
            --dest target/output `
            --install-dir "Program Files\ControlPacientes" `
            --win-menu `
            --win-menu-group "ControlPacientes" `
            --win-dir-chooser `
            --win-shortcut `
            --description "Sistema de Control de Pacientes" `
            --vendor "ControlPacientes" `
            --app-version "1.0.0" `
            --java-options "-Xmx512m"
          
          Write-Host "jpackage exit code: $LASTEXITCODE"
          
          Write-Host "Checking for generated files..."
          Write-Host "Output directory contents:"
          Get-ChildItem target/output -Recurse | ForEach-Object { Write-Host "  - $($_.FullName)" }
          
          # Copiar MSI al target si está en output
          if (Test-Path "target/output/*.msi") {
            Write-Host "Found MSI in output directory, copying to target..."
            Copy-Item "target/output/*.msi" "target/" -Force
          }
        shell: powershell
        continue-on-error: false
      
      - name: Clean up unnecessary files
        run: |
          # Limpiar caché de Maven local
          if (Test-Path "$env:USERPROFILE\.m2\repository") {
            Get-ChildItem -Path "$env:USERPROFILE\.m2\repository" -Recurse -Include "*.jar" | Where-Object { $_.Length -gt 100MB } | Remove-Item -Force -ErrorAction SilentlyContinue
          }
          
          # Eliminar directorios temporales
          Remove-Item -Recurse -Force "tools" -ErrorAction SilentlyContinue
          Remove-Item -Force "launch4j.zip" -ErrorAction SilentlyContinue
          Remove-Item -Force "wix314.exe" -ErrorAction SilentlyContinue
          Remove-Item -Force "launch4j-config.xml" -ErrorAction SilentlyContinue
          
          # Limpiar archivos innecesarios del target
          Remove-Item -Recurse -Force "target\*.txt" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "target\surefire-reports" -ErrorAction SilentlyContinue
        shell: powershell
        continue-on-error: true
      
      - name: List generated files
        run: |
          Write-Host "Searching for MSI files in target directory..."
          $msiFiles = Get-ChildItem -Path target -Include *.msi -ErrorAction SilentlyContinue
          if ($msiFiles) {
            Write-Host "Found MSI files:"
            $msiFiles | ForEach-Object { Write-Host "  - $($_.FullName) ($('{0:N2}' -f ($_.Length / 1MB)) MB)" }
          } else {
            Write-Host "No MSI files found in target directory"
            Write-Host "Target directory contents:"
            Get-ChildItem -Path target | ForEach-Object { Write-Host "  - $($_.Name)" }
          }
        shell: powershell
        continue-on-error: true
      
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: control-pacientes-windows-installer
          path: target/*.msi
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: target/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
