name: Build JAR Artifacts

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-windows-jar:
    runs-on: ubuntu-latest
    name: Build Windows JAR
    strategy:
      matrix:
        variant: 
          - {name: "standard", profile: "windows,prod", suffix: ""}
          - {name: "emerald", profile: "windows,emerald,prod", suffix: "-emerald"}
          - {name: "dark", profile: "windows,dark,prod", suffix: "-dark"}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: '19'
          distribution: 'temurin'
          cache: maven
      
      - name: Build Windows JAR (${{ matrix.variant.name }})
        run: mvn clean package -P${{ matrix.variant.profile }} -DskipTests
      
      - name: Rename JAR for Windows
        run: |
          if [ -f "target/control-pacientes.jar" ]; then
            mv target/control-pacientes.jar target/control-pacientes-windows${{ matrix.variant.suffix }}.jar
          fi
      
      - name: Upload Windows JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-pacientes-windows-jar-${{ matrix.variant.name }}
          path: target/control-pacientes-windows${{ matrix.variant.suffix }}.jar
          retention-days: 30

  build-linux-jar:
    runs-on: ubuntu-latest
    name: Build Linux JAR
    strategy:
      matrix:
        variant: 
          - {name: "standard", profile: "linux,prod", suffix: ""}
          - {name: "emerald", profile: "linux,emerald,prod", suffix: "-emerald"}
          - {name: "dark", profile: "linux,dark,prod", suffix: "-dark"}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: '19'
          distribution: 'temurin'
          cache: maven
      
      - name: Build Linux JAR (${{ matrix.variant.name }})
        run: mvn clean package -P${{ matrix.variant.profile }} -DskipTests
      
      - name: Rename JAR for Linux
        run: |
          if [ -f "target/control-pacientes.jar" ]; then
            mv target/control-pacientes.jar target/control-pacientes-linux${{ matrix.variant.suffix }}.jar
          fi
      
      - name: Upload Linux JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-pacientes-linux-jar-${{ matrix.variant.name }}
          path: target/control-pacientes-linux${{ matrix.variant.suffix }}.jar
          retention-days: 30

  build-macos-jar:
    runs-on: macos-latest
    name: Build macOS JAR
    strategy:
      matrix:
        variant: 
          - {name: "standard", profile: "macos,prod", suffix: ""}
          - {name: "emerald", profile: "macos,emerald,prod", suffix: "-emerald"}
          - {name: "dark", profile: "macos,dark,prod", suffix: "-dark"}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: '19'
          distribution: 'temurin'
          cache: maven
      
      - name: Build macOS JAR (${{ matrix.variant.name }})
        run: mvn clean package -P${{ matrix.variant.profile }} -DskipTests
      
      - name: Rename JAR for macOS
        run: |
          if [ -f "target/control-pacientes.jar" ]; then
            mv target/control-pacientes.jar target/control-pacientes-macos${{ matrix.variant.suffix }}.jar
          fi
      
      - name: Upload macOS JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-pacientes-macos-jar-${{ matrix.variant.name }}
          path: target/control-pacientes-macos${{ matrix.variant.suffix }}.jar
          retention-days: 30

  create-release:
    needs: [build-windows-jar, build-linux-jar, build-macos-jar]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/control-pacientes-windows-jar-standard/*.jar release/ 2>/dev/null || true
          cp artifacts/control-pacientes-windows-jar-emerald/*.jar release/ 2>/dev/null || true
          cp artifacts/control-pacientes-windows-jar-dark/*.jar release/ 2>/dev/null || true
          cp artifacts/control-pacientes-linux-jar-standard/*.jar release/ 2>/dev/null || true
          cp artifacts/control-pacientes-linux-jar-emerald/*.jar release/ 2>/dev/null || true
          cp artifacts/control-pacientes-linux-jar-dark/*.jar release/ 2>/dev/null || true
          cp artifacts/control-pacientes-macos-jar-standard/*.jar release/ 2>/dev/null || true
          cp artifacts/control-pacientes-macos-jar-emerald/*.jar release/ 2>/dev/null || true
          cp artifacts/control-pacientes-macos-jar-dark/*.jar release/ 2>/dev/null || true
          ls -lh release/
      
      - name: Create Release with JARs
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/control-pacientes-windows.jar
            release/control-pacientes-windows-emerald.jar
            release/control-pacientes-windows-dark.jar
            release/control-pacientes-linux.jar
            release/control-pacientes-linux-emerald.jar
            release/control-pacientes-linux-dark.jar
            release/control-pacientes-macos.jar
            release/control-pacientes-macos-emerald.jar
            release/control-pacientes-macos-dark.jar
          draft: false
          prerelease: false
          body: |
            ## Control Pacientes - Optimized JAR Release
            
            Each JAR is optimized for its specific platform with minimal dependencies.
            
            ### Available JARs
            
            #### Windows JAR (Standard Theme)
            **`control-pacientes-windows.jar`**
            - Optimized for Windows 10+
            - Includes Windows-specific JavaFX libraries
            - Standard color theme
            - Minimized dependencies
            
            ##### Run on Windows (Standard)
            ```cmd
            java -server -XX:+UseG1GC -Xms1g -Xmx2g -jar control-pacientes-windows.jar
            ```
            
            #### Windows JAR (Emerald Theme) 🌿
            **`control-pacientes-windows-emerald.jar`**
            - Optimized for Windows 10+
            - Includes Windows-specific JavaFX libraries
            - Emerald green color theme (healing & fresh)
            - Minimized dependencies
            
            ##### Run on Windows (Emerald)
            ```cmd
            java -server -XX:+UseG1GC -Xms1g -Xmx2g -jar control-pacientes-windows-emerald.jar
            ```
            
            #### Linux JAR
            **`control-pacientes-linux.jar`**
            - Optimized for Linux
            - Includes Linux-specific JavaFX libraries
            - Standard color theme
            - Minimized dependencies
            
            ##### Run on Linux (Standard)
            ```bash
            java -server -XX:+UseG1GC -Xms1g -Xmx2g -jar control-pacientes-linux.jar
            ```
            
            #### Linux JAR (Emerald Theme) 🌿
            **`control-pacientes-linux-emerald.jar`**
            - Optimized for Linux
            - Includes Linux-specific JavaFX libraries
            - Emerald green color theme (healing & fresh)
            - Minimized dependencies
            
            ##### Run on Linux (Emerald)
            ```bash
            java -server -XX:+UseG1GC -Xms1g -Xmx2g -jar control-pacientes-linux-emerald.jar
            ```
            
            #### macOS JAR
            **`control-pacientes-macos.jar`**
            - Optimized for macOS 10.14+
            - Includes macOS-specific JavaFX libraries
            - Standard color theme
            - Minimized dependencies
            
            ##### Run on macOS (Standard)
            ```bash
            java -server -XX:+UseG1GC -Xms1g -Xmx2g -jar control-pacientes-macos.jar
            ```
            
            #### macOS JAR (Emerald Theme) 🌿
            **`control-pacientes-macos-emerald.jar`**
            - Optimized for macOS 10.14+
            - Includes macOS-specific JavaFX libraries
            - Emerald green color theme (healing & fresh)
            - Minimized dependencies
            
            ##### Run on macOS (Emerald)
            ```bash
            java -server -XX:+UseG1GC -Xms1g -Xmx2g -jar control-pacientes-macos-emerald.jar
            ```
            
            #### Windows JAR (Dark Theme) 🌙
            **`control-pacientes-windows-dark.jar`**
            - Optimized for Windows 10+
            - Includes Windows-specific JavaFX libraries
            - Dark theme with blue accents (accessibility & reduced eye strain)
            - Minimized dependencies
            
            ##### Run on Windows (Dark)
            ```cmd
            java -server -XX:+UseG1GC -Xms1g -Xmx2g -jar control-pacientes-windows-dark.jar
            ```
            
            #### Linux JAR (Dark Theme) 🌙
            **`control-pacientes-linux-dark.jar`**
            - Optimized for Linux
            - Includes Linux-specific JavaFX libraries
            - Dark theme with blue accents (accessibility & reduced eye strain)
            - Minimized dependencies
            
            ##### Run on Linux (Dark)
            ```bash
            java -server -XX:+UseG1GC -Xms1g -Xmx2g -jar control-pacientes-linux-dark.jar
            ```
            
            #### macOS JAR (Dark Theme) 🌙
            **`control-pacientes-macos-dark.jar`**
            - Optimized for macOS 10.14+
            - Includes macOS-specific JavaFX libraries
            - Dark theme with blue accents (accessibility & reduced eye strain)
            - Minimized dependencies
            
            ##### Run on macOS (Dark)
            ```bash
            java -server -XX:+UseG1GC -Xms1g -Xmx2g -jar control-pacientes-macos-dark.jar
            ```
            
            ### System Requirements
            - **Java 19+** (required)
            - **RAM**: 2+ GB recommended
            - **Storage**: 500 MB free space
            
            ### Quick Start
            1. Download the JAR file for your operating system
            2. Ensure Java 19+ is installed
            3. Run the command for your OS (see above)
            4. Application will create/use SQLite database in working directory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
